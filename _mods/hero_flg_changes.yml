英雄: 苦修者 (Flagellant)
改动总览: 大幅增强，提升伤害、生存能力和功能性

基础属性改动:
  - 生命值: 50 → 55 (+5)
  - 速度: 3 → 4 (+1)
  - 新增: 名称覆盖 ID

核心技能改动:

  - 技能: 惩罚 (Punish - flg_punish)
    改动类型: 伤害+暴击+效果
    详细:
      - 基础伤害: 3-3 → 4-3 (+1 伤害)
      - 基础暴击: 5% → 10% (翻倍)
      - 升级伤害: 4-4 → 5-4 (+1 伤害)
      - 升级暴击: 10% → 20% (翻倍)
      - 移除效果: 使用者增加枯萎持续时间
      - 新增效果: 目标获得 30% 忽略枯萎抗性

  - 技能: 悲雨 (Rain of Sorrows - flg_rain_of_sorrows)
    改动类型: 伤害+暴击+枯萎强度+效果
    详细:
      - 基础伤害: 2-1 → 3-1 (+1 伤害)
      - 基础暴击: 5% → 10% (翻倍)
      - 升级伤害: 3-1 → 4-2 (+1 伤害，+1 波动)
      - 升级暴击: 10% → 20% (翻倍)
      - 枯萎强度: 小 → 中 (基础版)
      - 枯萎强度: 中 → 大 (升级版)
      - 移除效果: 使用者增加枯萎伤害
      - 新增效果: 目标获得 30% 忽略枯萎抗性
      - 新增: 基础版添加解锁节点

  - 技能: 放血 (Exsanguinate - flg_exsanguinate)
    改动类型: 伤害+暴击
    详细:
      - 基础伤害: 4-4 → 5-4 (+1 伤害)
      - 基础暴击: 5% → 10% (翻倍)
      - 升级伤害: 6-4 → 7-4 (+1 伤害)
      - 升级暴击: 5% → 10% (翻倍)
      - 新增: 基础版添加解锁节点

  - 技能: 收回 (Reclaim - flg_reclaim)
    改动类型: 机制+冷却
    详细:
      - 多目标: 否 → 是
      - 冷却时间: 1 → 2
      - 新增: 基础版添加解锁节点

  - 技能: 救赎 (Redeem - flg_redeem)
    改动类型: 效果+自残
    详细:
      - 新增效果: 目标治疗 1 压力 (基础版)
      - 新增效果: 目标移除所有枯萎 + 治疗 1 压力 (升级版)
      - 自我伤害: 20% → 10% (减半)
      - 新增效果: 使用者移除所有枯萎 (升级版)

  - 技能: 忍受 (Endure - flg_endure)
    改动类型: 效果
    详细:
      - 自我压力伤害: 2 → 1 (减半)
      - 新增效果: 使用者获得 +1 格挡 (基础版)
      - 新增效果: 目标消除所有负面代币 (升级版)
      - 新增效果: 使用者获得 +1 格挡 (升级版)

  - 技能: 受难 (Suffer - flg_suffer)
    改动类型: 效果
    详细:
      - 新增效果: 目标移除所有可见连击标记
      - 新增: 基础版添加解锁节点

  - 技能: 渴求更多 (More! More! - flg_more_more)
    改动类型: 效果
    详细:
      - 新增效果: 使用者治疗 1 压力 (基础版)
      - 新增效果: 使用者治疗 2 压力 (升级版)
      - 新增: 基础版添加解锁节点

  - 技能: 坏死 (Necrosis - flg_necrosis)
    改动类型: 伤害+暴击+治疗
    详细:
      - 基础伤害: 3-3 → 4-3 (+1 伤害)
      - 升级伤害: 4-4 → 5-4 (+1 伤害)
      - 升级暴击: 5% → 10% (翻倍)
      - 治疗效果: 每目标 5% (移除特殊治疗限制)

  - 技能: 演出敌人 (Act Out Enemy - flg_act_out_enemy)
    改动类型: 伤害+暴击
    详细:
      - 伤害: 4-4 → 5-4 (+1 伤害)
      - 暴击: 5% → 10% (翻倍)

  - 技能: 演出友方 (Act Out Friendly - flg_act_out_friendly)
    改动类型: 伤害+暴击
    详细:
      - 伤害: 4-4 → 5-4 (+1 伤害)
      - 暴击: 5% → 10% (翻倍)

